name: SCURRY quality gates
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse every browser module and test (no npm install)
        run: |
          find js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Audit published model inventory, glTF integrity and new source evidence
        run: node tools/audit-assets.mjs
      - name: Inspect model geometry and collect a portable source-metrics report
        run: node tools/model-stats.mjs
      - name: Archive model source metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scurry-model-stats
          path: .ci/model-stats.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Pure physics and input regressions
        run: node --test tests/*.mjs
      - name: No-build, custom-domain, touch and Safari contracts
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const main = fs.readFileSync('js/main.js', 'utf8');
          const touch = fs.readFileSync('js/ui/touch.js', 'utf8');
          assert.equal(fs.readFileSync('CNAME', 'utf8').trim(), 'scurry.cold.fyi');
          assert.match(html, /type="importmap"/);
          assert.match(html, /viewport-fit=cover/);
          assert.match(html, /id="touchui"/);
          assert.match(html, /id="lookzone"/);
          const version = html.match(/name="scurry-version" content="(\d+\.\d+\.\d+)"/);
          assert.ok(version, 'the HTML exposes a semantic scurry-version');
          assert.ok(fs.readFileSync('README.md', 'utf8').includes('**Current version: v' + version[1] + '.**'), 'README matches HTML version');
          assert.match(main, /visibilitychange/);
          assert.match(touch, /pointercancel/);
          assert.match(touch, /pagehide/);
          console.log('CNAME, importmap, mobile controls, Safari lifecycle: OK');
          NODE
