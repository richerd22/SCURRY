name: SCURRY browser smoke

on:
  push:
    branches: [main]
    # Browser boot/play belongs to runtime changes, not documentation-only
    # or model-audit-script-only commits (those have fast quality gates).
    paths:
      - 'js/**'
      - 'index.html'
      - 'assets/models/**'
      - 'harness/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

# Let the *running* browser suite finish. GitHub keeps one running and
# at most one queued run per branch (newer pending replaces older pending).
# Previous cancel-in-progress=true caused every rapid main push to abort
# before real walk tests ran, leaving no browser evidence for releases.
concurrency:
  group: scurry-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chromium-webgl:
    name: chromium-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [gameplay, visuals]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache headless Chromium browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-scurry-playwright-1.57.0
      - name: Install browser test runner (CI only, no game build)
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run static web server and headless WebGL routes
        env:
          SCURRY_BASE_URL: http://127.0.0.1:8000
          SCURRY_TEST_MODE: ${{ matrix.suite }}
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/scurry-server.log 2>&1 &
          echo $! > /tmp/scurry-server.pid
          trap 'kill $(cat /tmp/scurry-server.pid) || true' EXIT
          node harness/browser-smoke.mjs
      - name: Preserve screenshot and console evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scurry-webgl-${{ matrix.suite }}
          path: .ci/browser-smoke/
          retention-days: 7
          if-no-files-found: warn
